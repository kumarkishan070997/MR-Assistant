<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cyanIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="64" cy="64" r="42" fill="url(#glowGrad)" opacity="0.15" filter="url(#glow)"/>

  <!-- Central Emblem: Pilot Wings & Code Anchor -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Pilot Chevron Ring -->
    <circle cx="64" cy="30" r="10" stroke="url(#cyanIndigo)" stroke-width="3.5" fill="#0f172a"/>
    
    <!-- AI Sparkle Core in Ring -->
    <path d="M64 24 Q64 30 70 30 Q64 30 64 36 Q64 30 58 30 Q64 30 64 24 Z" fill="#38bdf8" filter="url(#glow)"/>

    <!-- Center Shank -->
    <line x1="64" y1="40" x2="64" y2="92" stroke="url(#cyanIndigo)" stroke-width="4.5"/>

    <!-- Left Code Bracket Wing < -->
    <path d="M48 48 L34 60 L48 72" stroke="url(#cyanIndigo)" stroke-width="4.5"/>

    <!-- Right Code Bracket Wing > -->
    <path d="M80 48 L94 60 L80 72" stroke="url(#cyanIndigo)" stroke-width="4.5"/>

    <!-- Anchor Flukes & Base -->
    <path d="M26 76 L26 84 C26 102 102 102 102 84 L102 76" stroke="url(#cyanIndigo)" stroke-width="4.5"/>
    <!-- Left Arrow Head -->
    <path d="M21 82 L26 74 L31 82" stroke="url(#cyanIndigo)" stroke-width="4" fill="url(#cyanIndigo)"/>
    <!-- Right Arrow Head -->
    <path d="M97 82 L102 74 L107 82" stroke="url(#cyanIndigo)" stroke-width="4" fill="url(#cyanIndigo)"/>

    <!-- Base Keel Point -->
    <path d="M64 92 L64 100" stroke="#38bdf8" stroke-width="4"/>
  </g>
</svg>
